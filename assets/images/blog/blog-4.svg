<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" fill="none">
  <rect width="640" height="400" fill="#202723"/>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#F4F1E8" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="url(#grid)"/>

  <!-- Industrial Hazard Stripe Accent Top -->
  <rect x="0" y="0" width="640" height="6" fill="#E5C747"/>

  <!-- Technical Spec Watermark -->
  <text x="32" y="42" fill="#F4F1E8" fill-opacity="0.35" font-family="'Barlow Condensed', sans-serif" font-size="12" font-weight="700" letter-spacing="2">DEFENDRA PROTOCOL SPEC // ANALYSIS</text>

  <!-- Central Graphic Container -->
  <rect x="440" y="50" width="160" height="160" fill="#28312C" stroke="#E5C747" stroke-width="1.5" rx="2"/>
  <circle cx="520" cy="130" r="50" fill="#E5C747" fill-opacity="0.15"/>
  
  <!-- Industrial Target Crosshair -->
  <circle cx="520" cy="130" r="32" stroke="#E5C747" stroke-width="2" fill="none"/>
  <line x1="480" y1="130" x2="560" y2="130" stroke="#E5C747" stroke-width="1.5" stroke-dasharray="4 2"/>
  <line x1="520" y1="90" x2="520" y2="170" stroke="#E5C747" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="520" cy="130" r="4" fill="#E5C747"/>

  <!-- Tag Pill -->
  <rect x="32" y="250" width="160" height="28" fill="#E5C747" rx="2"/>
  <text x="112" y="269" text-anchor="middle" fill="#202723" font-family="'Barlow Condensed', sans-serif" font-size="13" font-weight="800" letter-spacing="1">ANALYSIS</text>

  <!-- Titles -->
  <text x="32" y="320" fill="#F4F1E8" font-family="'Barlow Condensed', sans-serif" font-size="28" font-weight="800">THERMAL HEAT VS CHEMICAL SPRAY FOR BED BUGS</text>
  <text x="32" y="352" fill="#F4F1E8" fill-opacity="0.75" font-family="'Inter', sans-serif" font-size="14">Scientific comparison of eradication efficacy and downtime</text>

  <!-- Calibration Line -->
  <line x1="32" y1="375" x2="608" y2="375" stroke="#F4F1E8" stroke-opacity="0.15" stroke-width="1"/>
</svg>